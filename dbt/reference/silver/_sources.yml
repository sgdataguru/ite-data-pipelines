version: 2

sources:
  - name: bronze
    schema: bronze
    description: "Raw tables written by the Day 1 ingestion labs."
    config:
      loaded_at_field: _ingested_at
      freshness:
        warn_after: {count: 24, period: hour}
        error_after: {count: 48, period: hour}
    tables:
      - name: file_attendance
        description: "Attendance rows from data/attendance/*.csv."
      - name: db_students
        description: "Student records from sources/ops.db."
      - name: api_grades
        description: "Grade records from the mock grades API."
