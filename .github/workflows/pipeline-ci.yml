# Continuous integration for the ITE Student Analytics pipeline.
#
# Runs on every pull request to main. Two jobs run side by side:
#   1. "Lint, load and dbt tests"   ruff, then the whole pipeline on workshop
#                                   data: Bronze loads + dbt build (models AND tests)
#   2. "Airflow DAGs load"          every DAG in dags/ imports without errors
# If either job fails, the pull request shows a red cross.
#
# You do not need to edit this file. Read it to see what "CI" checks.

name: Pipeline CI

on:
  pull_request:
    branches: [main]

env:
  # The workshop's fake token. The mock API accepts it; it is not a secret.
  SOURCE_API_TOKEN: workshop-token-not-a-real-secret
  MOCK_API_URL: http://localhost:8000
  DUCKDB_PATH: ${{ github.workspace }}/warehouse/pipeline.duckdb
  DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
  # Use the repository secret PII_SALT if one exists. The fallback only keeps
  # the workshop running without setup. In real work there would be NO
  # fallback: a missing secret should stop the pipeline.
  PII_SALT: ${{ secrets.PII_SALT || 'ci-only-salt-not-a-secret' }}

jobs:
  lint-and-dbt:
    name: Lint, load and dbt tests
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the workshop tools
        run: pip install -r requirements.txt

      - name: Check code style with ruff
        run: ruff check .

      - name: Create the warehouse
        run: make init

      - name: Start the mock grades API
        run: make api

      - name: Load the three sources into Bronze
        run: make bronze

      - name: dbt build and tests on workshop data
        run: |
          cd dbt
          dbt seed
          dbt build

  dag-integrity:
    name: Airflow DAGs load without errors
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-airflow.txt

      - name: Install Airflow (with its official constraints file)
        run: >-
          pip install -r requirements-airflow.txt "pytest==9.1.1"
          --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-3.3.2/constraints-3.12.txt"

      - name: Check every DAG loads
        run: python -m pytest -v tests/test_dag_integrity.py
